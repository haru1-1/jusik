<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>글로벌 모의투자 App</title>
  
  <!-- PWA 매니페스트 및 앱 아이콘 설정 -->
  <link rel="manifest" id="manifest-placeholder">
  <meta name="theme-color" content="#0b0e14">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="모의투자">

  <style>
    :root {
      --bg: #0b0e14;
      --card: #151921;
      --card-hover: #1c222d;
      --border: rgba(255, 255, 255, 0.08);
      --text: #f3f4f6;
      --sub: #9ca3af;
      --up: #ff4d4d;
      --down: #458fff;
      --accent: #6366f1;
      --accent-light: rgba(99, 102, 241, 0.15);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background: var(--bg); color: var(--text); padding: 12px; max-width: 1200px; margin: 0 auto; padding-bottom: 40px; }

    /* Header & Summary Section */
    .header-card {
      background: linear-gradient(135deg, #1e1b4b 0%, #151921 100%);
      border: 1px solid rgba(99, 102, 241, 0.3);
      padding: 16px; border-radius: 16px;
      display: flex; flex-direction: column; gap: 12px;
      margin-bottom: 14px; box-shadow: 0 8px 20px rgba(0,0,0,0.3);
    }
    @media (min-width: 600px) {
      .header-card { flex-direction: row; justify-content: space-between; align-items: center; padding: 20px 24px; }
    }
    .header-card h1 { font-size: 1.2rem; font-weight: 700; color: #fff; display: flex; align-items: center; gap: 8px; }
    .asset-val { font-size: 1.4rem; font-weight: 800; color: #10b981; margin-top: 2px; }

    .header-actions { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .action-btn {
      display: inline-flex; align-items: center; gap: 4px;
      background: rgba(255, 255, 255, 0.06); color: var(--text); border: 1px solid var(--border);
      padding: 8px 12px; border-radius: 10px; font-size: 0.8rem; font-weight: 600; cursor: pointer; transition: all 0.2s;
    }
    .action-btn:hover { background: rgba(255, 255, 255, 0.12); }
    .install-btn {
      display: none; background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%);
      color: #fff; border: none; box-shadow: 0 4px 12px rgba(99, 102, 241, 0.4);
    }
    .reset-btn { color: #f87171; border-color: rgba(248, 113, 113, 0.3); }
    .reset-btn:hover { background: rgba(248, 113, 113, 0.15); }

    .status-badge {
      display: inline-flex; align-items: center; gap: 6px;
      font-size: 0.75rem; padding: 4px 10px; border-radius: 12px;
      background: rgba(16, 185, 129, 0.15); color: #10b981; font-weight: 600;
    }
    .status-dot { width: 6px; height: 6px; border-radius: 50%; background: #10b981; animation: pulse 1.5s infinite; }
    @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.3; } 100% { opacity: 1; } }

    /* Main Navigation */
    .main-nav { display: flex; gap: 8px; margin-bottom: 14px; }
    .main-nav button {
      flex: 1; padding: 12px; background: var(--card); color: var(--sub);
      border: 1px solid var(--border); border-radius: 12px; font-size: 0.9rem;
      font-weight: 700; cursor: pointer; transition: all 0.2s ease;
    }
    .main-nav button.active {
      background: var(--accent); color: #fff; border-color: var(--accent);
      box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3);
    }

    /* Search & Filter Bar */
    .filter-wrapper { display: flex; flex-direction: column; gap: 10px; margin-bottom: 14px; }
    .search-input {
      width: 100%; padding: 12px 16px; background: var(--card); border: 1px solid var(--border);
      border-radius: 12px; color: #fff; font-size: 0.95rem; outline: none; transition: border 0.2s;
    }
    .search-input:focus { border-color: var(--accent); }

    .filter-bar { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: none; }
    .filter-bar::-webkit-scrollbar { display: none; }
    .filter-bar button {
      background: rgba(255,255,255,0.04); color: var(--sub); border: 1px solid var(--border);
      padding: 8px 14px; border-radius: 20px; font-size: 0.8rem; font-weight: 600;
      cursor: pointer; white-space: nowrap; transition: all 0.2s;
    }
    .filter-bar button.active { background: #fff; color: #000; border-color: #fff; }

    /* Layout Structure */
    .layout { display: grid; grid-template-columns: 1fr; gap: 14px; }
    @media (min-width: 900px) { .layout { grid-template-columns: 1fr 360px; } }

    /* Stock List Card Style */
    .stock-list { display: flex; flex-direction: column; gap: 8px; max-height: 65vh; overflow-y: auto; padding-right: 2px; }
    .stock-card {
      background: var(--card); border: 1px solid var(--border); border-radius: 14px;
      padding: 12px 16px; display: flex; justify-content: space-between; align-items: center;
      cursor: pointer; transition: background 0.15s ease;
    }
    .stock-card:active { background: var(--card-hover); }
    
    .badge { font-size: 0.65rem; padding: 2px 6px; border-radius: 4px; margin-right: 6px; font-weight: 700; display: inline-block; }
    .badge-kospi { background: rgba(255, 77, 77, 0.15); color: var(--up); }
    .badge-kosdaq { background: rgba(69, 143, 255, 0.15); color: var(--down); }

    .up { color: var(--up); }
    .down { color: var(--down); }

    /* Side Panels */
    .panel { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 16px; margin-bottom: 14px; }
    .panel-title { font-size: 0.85rem; color: var(--sub); font-weight: 600; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
    
    .ai-box {
      background: var(--accent-light); border: 1px solid var(--accent);
      padding: 12px; border-radius: 12px; font-size: 0.82rem; line-height: 1.4; color: #e0e7ff;
    }

    input[type="number"] {
      width: 100%; padding: 12px; background: rgba(0, 0, 0, 0.3);
      border: 1px solid var(--border); color: #fff; margin: 8px 0;
      text-align: right; border-radius: 10px; font-size: 1rem; font-weight: 600;
      outline: none;
    }
    input[type="number"]:focus { border-color: var(--accent); }

    .btn-group { display: flex; gap: 10px; margin-top: 10px; }
    .btn-group button {
      flex: 1; padding: 14px; border: none; border-radius: 10px;
      font-size: 0.95rem; font-weight: 700; color: #fff; cursor: pointer;
    }
    .buy { background: var(--up); box-shadow: 0 4px 12px rgba(255, 77, 77, 0.2); }
    .sell { background: var(--down); box-shadow: 0 4px 12px rgba(69, 143, 255, 0.2); }

    /* Dashboard UI */
    .dash-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 14px; }
    .dash-card { background: var(--card); border: 1px solid var(--border); padding: 14px; border-radius: 14px; }
    .dash-card .title { font-size: 0.75rem; color: var(--sub); font-weight: 600; }
    .dash-card .number { font-size: 1.1rem; font-weight: 700; margin-top: 4px; word-break: break-all; }

    .table-container { width: 100%; overflow-x: auto; }
    .portfolio-table { width: 100%; border-collapse: collapse; margin-top: 4px; font-size: 0.85rem; white-space: nowrap; }
    .portfolio-table th, .portfolio-table td { padding: 10px 8px; text-align: right; border-bottom: 1px solid var(--border); }
    .portfolio-table th:first-child, .portfolio-table td:first-child { text-align: left; }
    .portfolio-table th { color: var(--sub); font-weight: 600; font-size: 0.75rem; }
  </style>
</head>
<body>

  <!-- Header Card -->
  <div class="header-card">
    <div>
      <h1>📈 국내 모의투자</h1>
      <div style="font-size: 0.75rem; color: var(--sub); margin-top: 4px; display: flex; align-items: center; gap: 6px;">
        <span class="status-badge" id="api-status"><span class="status-dot"></span>실시간 동기화 중</span>
      </div>
    </div>
    <div class="header-actions">
      <button class="action-btn install-btn" id="install-btn" onclick="installApp()">📲 앱 설치</button>
      <button class="action-btn reset-btn" onclick="resetAccount()">⚙️ 초기화</button>
      <div style="text-align: right;">
        <div style="font-size: 0.75rem; color: var(--sub);">총 평가 자산</div>
        <div class="asset-val" id="header-total-asset">1,000,000,000 원</div>
      </div>
    </div>
  </div>

  <!-- Main Tabs -->
  <div class="main-nav">
    <button class="active" onclick="switchMainTab('market', this)">📊 거래소</button>
    <button onclick="switchMainTab('dashboard', this)">💼 내 자산</button>
  </div>

  <!-- Tab 1: 주식 거래소 -->
  <div id="tab-market">
    <div class="filter-wrapper">
      <input type="text" id="search-input" class="search-input" placeholder="🔍 종목명 또는 종목코드 검색..." oninput="onSearchInput()">
      <div class="filter-bar">
        <button class="active" onclick="setFilter('all', this)">전체</button>
        <button onclick="setFilter('kospi', this)">🔴 코스피</button>
        <button onclick="setFilter('kosdaq', this)">🔵 코스닥</button>
        <button onclick="setFilter('gainers', this)">🔥 급상승</button>
        <button onclick="setFilter('losers', this)">📉 급하락</button>
      </div>
    </div>

    <div class="layout">
      <div class="stock-list" id="list"></div>

      <div>
        <!-- AI Analysis -->
        <div class="panel">
          <div class="panel-title">🤖 AI 종목 진단 리포트</div>
          <div id="ai-title" style="font-size: 1rem; font-weight: 700; margin-bottom: 6px;">종목을 선택하세요</div>
          <div class="ai-box" id="ai-desc">목록에서 종목을 선택하면 실시간 변동 폭을 분석해 드립니다.</div>
        </div>

        <!-- Trading Panel -->
        <div class="panel">
          <div class="panel-title">⚡ 빠른 주문</div>
          <div id="target-name" style="font-weight: 700; color: var(--sub); font-size: 0.9rem;">선택된 종목 없음</div>
          <input type="number" id="qty" value="1" min="1" oninput="calcTotal()">
          <div style="font-size: 0.82rem; text-align: right; color: var(--sub); margin-bottom: 10px;">
            주문 예정 금액: <span id="total-price" style="color: #fff; font-weight: 700;">0</span> 원
          </div>
          <div class="btn-group">
            <button class="buy" onclick="trade('BUY')">매수</button>
            <button class="sell" onclick="trade('SELL')">매도</button>
          </div>
        </div>

        <!-- Quick Balance Panel -->
        <div class="panel">
          <div class="panel-title">보유 요약</div>
          <div id="portfolio-summary" style="font-size: 0.82rem; color: var(--sub);">보유한 주식이 없습니다.</div>
        </div>
      </div>
    </div>
  </div>

  <!-- Tab 2: 자산 리포트 대시보드 -->
  <div id="tab-dashboard" style="display: none;">
    <div class="dash-grid">
      <div class="dash-card">
        <div class="title">예수금 (현금)</div>
        <div class="number" id="dash-cash">0 원</div>
      </div>
      <div class="dash-card">
        <div class="title">주식 평가금액</div>
        <div class="number" id="dash-eval">0 원</div>
      </div>
      <div class="dash-card">
        <div class="title">총 투자 원금</div>
        <div class="number" id="dash-buy">0 원</div>
      </div>
      <div class="dash-card">
        <div class="title">평가 손익 / 수익률</div>
        <div class="number" id="dash-profit">0 원 (0.00%)</div>

  <script>
    // -------------------------------------------------------------
    // PWA Manifest 및 앱 아이콘 설정

    const svgIcon = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none"><rect width="512" height="512" rx="128" fill="#151921"/><path d="M112 352L208 240L288 304L400 160" stroke="#ff4d4d" stroke-width="36" stroke-linecap="round" stroke-linejoin="round"/><path d="M320 160H400V240" stroke="#ff4d4d" stroke-width="36" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
    const iconUrl = 'data:image/svg+xml;base64,' + btoa(svgIcon);

    const appleIcon = document.createElement('link');
    appleIcon.rel = 'apple-touch-icon';
    appleIcon.href = iconUrl;
    document.head.appendChild(appleIcon);

    const manifestData = {
      name: "글로벌 모의투자 App",
      short_name: "모의투자",
      start_url: ".",
      display: "standalone",
      background_color: "#0b0e14",
      theme_color: "#0b0e14",
      icons: [{ src: iconUrl, sizes: "512x512", type: "image/svg+xml", purpose: "any maskable" }]
    };
    const manifestBlob = new Blob([JSON.stringify(manifestData)], { type: 'application/json' });
    document.getElementById('manifest-placeholder').href = URL.createObjectURL(manifestBlob);

    let deferredPrompt = null;
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      const btn = document.getElementById('install-btn');
      if (btn) btn.style.display = 'inline-flex';
    });

    async function installApp() {
      if (!deferredPrompt) return;
      deferredPrompt.prompt();
      const { outcome } = await deferredPrompt.userChoice;
      if (outcome === 'accepted') document.getElementById('install-btn').style.display = 'none';
      deferredPrompt = null;
    }

    // -------------------------------------------------------------
    // 데이터 영구 저장 (localStorage) 및 모의투자 상태 관리
    // -------------------------------------------------------------
    let cash = 1000000000;
    let portfolio = {};

    function loadUserData() {
      const savedCash = localStorage.getItem('sim_cash');
      const savedPf = localStorage.getItem('sim_portfolio');
      if (savedCash !== null) cash = parseFloat(savedCash);
      if (savedPf !== null) {
        try { portfolio = JSON.parse(savedPf); } catch(e) { portfolio = {}; }
      }
    }

    function saveUserData() {
      localStorage.setItem('sim_cash', cash);
      localStorage.setItem('sim_portfolio', JSON.stringify(portfolio));
    }

    function resetAccount() {
      if (confirm("정말로 계좌를 초기화하시겠습니까? 모든 자산과 거래 내역이 처음 상태로 돌아갑니다.")) {
        localStorage.removeItem('sim_cash');
        localStorage.removeItem('sim_portfolio');
        cash = 1000000000;
        portfolio = {};
        renderPortfolioSummary();
        updateDashboard();
        alert("계좌가 초기화되었습니다.");
      }
    }

    loadUserData();

    let selected = null;
    let currentFilter = 'all';
    let searchQuery = '';

      { name: "리노공업", symbol: "058470", yahoo: "058470.KQ", defaultPrice: 205000 },
      { name: "레인보우로보틱스", symbol: "277810", yahoo: "277810.KQ", defaultPrice: 135000 },
      { name: "셀트리온제약", symbol: "068760", yahoo: "068760.KQ", defaultPrice: 68000 },
      { name: "클래시스", symbol: "214150", yahoo: "214150.KQ", defaultPrice: 52000 },
      { name: "펄어비스", symbol: "263750", yahoo: "263750.KQ", defaultPrice: 38000 },
      { name: "JYP Ent.", symbol: "035900", yahoo: "035900.KQ", defaultPrice: 55000 },
      { name: "에스엠", symbol: "041510", yahoo: "041510.KQ", defaultPrice: 72000 },
      { name: "엔씨소프트", symbol: "036570", yahoo: "036570.KQ", defaultPrice: 195000 },
      { name: "위메이드", symbol: "112040", yahoo: "112040.KQ", defaultPrice: 38000 },
      { name: "카카오게임즈", symbol: "293490", yahoo: "293490.KQ", defaultPrice: 18500 },
      { name: "휴젤", symbol: "145020", yahoo: "145020.KQ", defaultPrice: 260000 },
      { name: "실리콘투", symbol: "257720", yahoo: "257720.KQ", defaultPrice: 42000 },
      { name: "리가켐바이오", symbol: "141080", yahoo: "141080.KQ", defaultPrice: 98000 },
      { name: "동진쎄미켐", symbol: "005290", yahoo: "005290.KQ", defaultPrice: 34000 },
      { name: "솔브레인", symbol: "357780", yahoo: "357780.KQ", defaultPrice: 240000 },
      { name: "원익IPS", symbol: "240810", yahoo: "240810.KQ", defaultPrice: 31000 },
      { name: "주성엔지니어링", symbol: "036930", yahoo: "036930.KQ", defaultPrice: 30000 },
      { name: "하나마이크론", symbol: "067310", yahoo: "067310.KQ", defaultPrice: 18000 },
      { name: "이오테크닉스", symbol: "039030", yahoo: "039030.KQ", defaultPrice: 165000 },
      { name: "파두", symbol: "440110", yahoo: "440110.KQ", defaultPrice: 17500 },
      { name: "HPSP", symbol: "403870", yahoo: "403870.KQ", defaultPrice: 38000 },
      { name: "삼양식품", symbol: "003230", yahoo: "003230.KS", defaultPrice: 580000 },
      { name: "엔켐", symbol: "223310", yahoo: "223310.KQ", defaultPrice: 195000 },
      { name: "오스코텍", symbol: "039200", yahoo: "039200.KQ", defaultPrice: 38000 },
      { name: "테크윙", symbol: "089030", yahoo: "089030.KQ", defaultPrice: 42000 }
    ];

    let marketData = [];

    rawKospi.forEach((item, idx) => {
      marketData.push({
        id: `KOSPI_${idx + 1}`,
        symbol: item.symbol,
        yahoo: item.yahoo,
        name: item.name,
        market: 'KOSPI',
        price: item.defaultPrice,
        rate: 0.0,
        volume: Math.floor(Math.random() * 8000 + 500) * 100000000
      });
    });

    rawKosdaq.forEach((item, idx) => {
      marketData.push({
        id: `KOSDAQ_${idx + 1}`,
        symbol: item.symbol,
        yahoo: item.yahoo,
        name: item.name,
        market: 'KOSDAQ',
        price: item.defaultPrice,
        rate: 0.0,
        volume: Math.floor(Math.random() * 6000 + 300) * 100000000
      });
    });

    render();
    renderPortfolioSummary();
    updateDashboard();

    async function fetchRealtimePrices() {
      try {
        const yahooSymbols = marketData.map(s => s.yahoo).join(',');
        const targetUrl = `https://query1.finance.yahoo.com/v7/finance/quote?symbols=${encodeURIComponent(yahooSymbols)}`;
        const res = await fetch(`https://api.allorigins.win/raw?url=${encodeURIComponent(targetUrl)}`);
        if (!res.ok) throw new Error('API 응답 이상');

        const json = await res.json();
        const quotes = json?.quoteResponse?.result;

        if (quotes && quotes.length > 0) {
          quotes.forEach(q => {
            const item = marketData.find(s => s.yahoo === q.symbol);
            if (item && q.regularMarketPrice) {
              item.price = Math.round(q.regularMarketPrice);
              item.rate = parseFloat((q.regularMarketChangePercent || 0).toFixed(2));
            }
          });

          document.getElementById('api-status').innerHTML = `<span class="status-dot"></span>실시간 동기화 완료`;
          document.getElementById('api-status').style.color = '#10b981';
        } else {
          throw new Error('데이터 비정상');
        }
      } catch (err) {
        marketData.forEach(s => {
          const delta = (Math.random() - 0.49) * 0.4;
          s.rate = parseFloat((s.rate + delta).toFixed(2));
          s.price = Math.max(100, Math.round(s.price * (1 + delta * 0.01)));
        });

        document.getElementById('api-status').innerHTML = `<span class="status-dot" style="background:#f59e0b;"></span>시뮬레이션 모드`;
        document.getElementById('api-status').style.color = '#f59e0b';
      }

      render();
      updateSelectedUI();
      updateDashboard();
    }

    fetchRealtimePrices();
    setInterval(fetchRealtimePrices, 3000);

    function switchMainTab(tab, btn) {
      document.querySelectorAll('.main-nav button').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');

      if (tab === 'market') {
        document.getElementById('tab-market').style.display = 'block';
        document.getElementById('tab-dashboard').style.display = 'none';
      } else {
        document.getElementById('tab-market').style.display = 'none';
        document.getElementById('tab-dashboard').style.display = 'block';
        updateDashboard();
      }
    }

    function onSearchInput() {
      searchQuery = document.getElementById('search-input').value.trim().toLowerCase();
      render();
    }

    function render() {
      let data = [...marketData];

      if (searchQuery) {
        data = data.filter(s => s.name.toLowerCase().includes(searchQuery) || s.symbol.includes(searchQuery));
      }

      if (currentFilter === 'kospi') data = data.filter(s => s.market === 'KOSPI');
      if (currentFilter === 'kosdaq') data = data.filter(s => s.market === 'KOSDAQ');

      if (currentFilter === 'gainers') {
        data.sort((a, b) => b.rate - a.rate);
      } else if (currentFilter === 'losers') {
        data.sort((a, b) => a.rate - b.rate);
      } else if (currentFilter === 'all') {
        data.sort((a, b) => b.volume - a.volume);
      }

      const list = document.getElementById('list');
      list.innerHTML = '';

      if (data.length === 0) {
        list.innerHTML = `<div style="text-align:center; padding: 40px; color:var(--sub);">검색 결과가 없습니다.</div>`;
        return;
      }

      data.forEach(s => {
        const el = document.createElement('div');
        el.className = 'stock-card';
        el.onclick = () => selectStock(s);
        el.innerHTML = `
          <div>
            <div>
              <span class="badge ${s.market === 'KOSPI' ? 'badge-kospi' : 'badge-kosdaq'}">${s.market}</span>
              <strong>${s.name}</strong> <span style="font-size:0.75rem; color:var(--sub);">${s.symbol}</span>
            </div>
            <div style="font-size:0.72rem; color:var(--sub); margin-top:2px;">
              거래대금 ${(s.volume / 100000000).toFixed(0)}억
            </div>
          </div>
          <div style="text-align:right;">
            <div style="font-size:0.95rem; font-weight:700;">${s.price.toLocaleString()}원</div>
            <div class="${s.rate >= 0 ? 'up' : 'down'}" style="font-size:0.8rem; font-weight:700; margin-top:2px;">
              ${s.rate >= 0 ? '▲' : '▼'} ${Math.abs(s.rate).toFixed(2)}%
            </div>
          </div>
        `;
        list.appendChild(el);
      });
    }

    function selectStock(s) {
      selected = s;
      updateSelectedUI();
    }

    function updateSelectedUI() {
      if (!selected) return;
      document.getElementById('target-name').innerText = `[${selected.market}] ${selected.name} (${selected.price.toLocaleString()}원)`;
      document.getElementById('ai-title').innerText = selected.name;
      calcTotal();

      let aiAnalysis = "";
      if (selected.rate > 3) {
        aiAnalysis = `🔥 <strong>상승 수급 포착</strong><br>${selected.market} 상위 수급 유입으로 강한 상승 흐름(+${selected.rate.toFixed(2)}%)을 나타내고 있습니다.`;
      } else if (selected.rate < -3) {
        aiAnalysis = `⚠️ <strong>과매도 구간</strong><br>단기 매도세 증가로 -${Math.abs(selected.rate).toFixed(2)}% 하락 중입니다. 분할 매수 관점 접근이 유효합니다.`;
      } else {
        aiAnalysis = `➡️ <strong>횡보 상태</strong><br>주가가 매물대 내에서 안정적인 흐름을 유지 중입니다.`;
      }
      document.getElementById('ai-desc').innerHTML = aiAnalysis;
    }

    function calcTotal() {
      if (!selected) return;
      const qty = parseFloat(document.getElementById('qty').value) || 0;
      document.getElementById('total-price').innerText = Math.round(qty * selected.price).toLocaleString();
    }

    function setFilter(filter, btn) {
      currentFilter = filter;
      document.querySelectorAll('.filter-bar button').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      render();
    }

    function trade(type) {
      if (!selected) return alert('종목을 선택하세요.');
      const qty = parseFloat(document.getElementById('qty').value) || 0;
      if (qty <= 0) return alert('수량을 입력하세요.');
      const cost = qty * selected.price;

      if (type === 'BUY') {
        if (cash < cost) return alert('예수금이 부족합니다.');
        cash -= cost;
        
        if (portfolio[selected.id]) {
          const prevTotal = portfolio[selected.id].qty * portfolio[selected.id].avgPrice;
          const newQty = portfolio[selected.id].qty + qty;
          portfolio[selected.id].avgPrice = (prevTotal + cost) / newQty;
          portfolio[selected.id].qty = newQty;
        } else {
          portfolio[selected.id] = { qty: qty, avgPrice: selected.price };
        }
      } else {
        if (!portfolio[selected.id] || portfolio[selected.id].qty < qty) return alert('보유 수량이 부족합니다.');
        cash += cost;
        portfolio[selected.id].qty -= qty;
        if (portfolio[selected.id].qty === 0) delete portfolio[selected.id];
      }

      saveUserData();
      renderPortfolioSummary();
      updateDashboard();
      alert(type === 'BUY' ? `${selected.name} ${qty}주 매수 완료!` : `${selected.name} ${qty}주 매도 완료!`);
    }

    function renderPortfolioSummary() {
      const pf = document.getElementById('portfolio-summary');
      const keys = Object.keys(portfolio);
      if (!keys.length) return pf.innerText = '보유한 주식이 없습니다.';
      pf.innerHTML = keys.map(id => {
        const item = marketData.find(x => x.id === id);
        const name = item ? item.name : id;
        return `<div style="display:flex; justify-content:space-between; margin-bottom:4px;">
          <span>${name}</span>
          <strong style="color:#fff;">${portfolio[id].qty}주</strong>
        </div>`;
      }).join('');
    }

    function updateDashboard() {
      let totalStockEval = 0;
      let totalStockBuy = 0;
      const tbody = document.getElementById('dash-list');
      const keys = Object.keys(portfolio);

      if (!keys.length) {
        tbody.innerHTML = '<tr><td colspan="7" style="text-align:center; color:var(--sub); padding:30px;">보유 중인 주식이 없습니다.</td></tr>';
      } else {
        tbody.innerHTML = '';
        keys.forEach(id => {
          const item = marketData.find(x => x.id === id);
          if (!item) return;
          const holding = portfolio[id];
          const buyAmt = holding.qty * holding.avgPrice;
          const evalAmt = holding.qty * item.price;
          const profit = evalAmt - buyAmt;
          const rate = ((item.price - holding.avgPrice) / holding.avgPrice) * 100;

          totalStockBuy += buyAmt;
          totalStockEval += evalAmt;

          const tr = document.createElement('tr');
          tr.innerHTML = `
            <td style="font-weight:700;">${item.name}</td>
            <td><span class="badge ${item.market === 'KOSPI' ? 'badge-kospi' : 'badge-kosdaq'}">${item.market}</span></td>
            <td>${holding.qty.toLocaleString()} 주</td>
            <td>${Math.round(holding.avgPrice).toLocaleString()} 원</td>
            <td>${item.price.toLocaleString()} 원</td>
            <td>${Math.round(evalAmt).toLocaleString()} 원</td>
            <td class="${rate >= 0 ? 'up' : 'down'}" style="font-weight:700;">
              ${rate >= 0 ? '+' : ''}${rate.toFixed(2)}%
            </td>
          `;
          tbody.appendChild(tr);
        });
      }

      const totalProfit = totalStockEval - totalStockBuy;
      const totalProfitRate = totalStockBuy > 0 ? (totalProfit / totalStockBuy) * 100 : 0;
      const totalAsset = cash + totalStockEval;

      document.getElementById('dash-cash').innerText = `${Math.round(cash).toLocaleString()} 원`;
      document.getElementById('dash-eval').innerText = `${Math.round(totalStockEval).toLocaleString()} 원`;
      document.getElementById('dash-buy').innerText = `${Math.round(totalStockBuy).toLocaleString()} 원`;
      
      const profitEl = document.getElementById('dash-profit');
      profitEl.innerText = `${totalProfit >= 0 ? '+' : ''}${Math.round(totalProfit).toLocaleString()} 원 (${totalProfitRate.toFixed(2)}%)`;
      profitEl.className = `number ${totalProfit >= 0 ? 'up' : 'down'}`;

      document.getElementById('header-total-asset').innerText = `${Math.round(totalAsset).toLocaleString()} 원`;
    }
  </script>
</body>
